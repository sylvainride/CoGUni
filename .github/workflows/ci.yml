name: CoGUni checks
'on':
  push:
    branches:
    - main
    - work/**
    - bootstrap/**
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: coguni-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONWARNINGS: error::ResourceWarning
jobs:
  owner-contracts:
    name: owner-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Fetch the bound public event commit without credentials
      shell: bash
      run: |-
        set -euo pipefail
        [[ "$GITHUB_REPOSITORY" == "sylvainride/CoGUni" ]]
        [[ "$GITHUB_REPOSITORY_ID" == "1418009675" ]]
        [[ "$GITHUB_REPOSITORY_OWNER_ID" == "265171248" ]]
        [[ "$GITHUB_SERVER_URL" == "https://github.com" ]]
        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
        git init --quiet
        git remote add origin https://github.com/sylvainride/CoGUni.git
        git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
        python3 --version
        git --version
    - name: Validate repository and checkout identity
      run: python3 -B tools/ci_repository_binding.py
    - name: Run owner and contract checks
      run: python3 -B tools/run_ci_checks.py --mode owner --out evidence/owner
    - name: Run continuity fixtures
      run: python3 -B tools/simulate_continuity_v8.py --variants 30 --seed 813 --out evidence/continuity
    - name: Run local outbox and owner replays
      run: python3 -B tools/run_simulations_v7.py --out evidence/replays
    - name: Emit whitelisted JSON evidence to the job log
      if: always()
      run: |-
        python3 -B - <<'PY'
        import json
        from pathlib import Path
        for name in ['evidence/owner/results.json', 'evidence/continuity/summary.json', 'evidence/replays/SIMULATIONS_V7_SUMMARY.json']:
            path = Path(name)
            if path.is_file():
                print(json.dumps({"evidence_file": name, "summary": json.loads(path.read_text())}, sort_keys=True))
        PY
  sandbox-runtime:
    name: sandbox-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Fetch the bound public event commit without credentials
      shell: bash
      run: |-
        set -euo pipefail
        [[ "$GITHUB_REPOSITORY" == "sylvainride/CoGUni" ]]
        [[ "$GITHUB_REPOSITORY_ID" == "1418009675" ]]
        [[ "$GITHUB_REPOSITORY_OWNER_ID" == "265171248" ]]
        [[ "$GITHUB_SERVER_URL" == "https://github.com" ]]
        [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
        git init --quiet
        git remote add origin https://github.com/sylvainride/CoGUni.git
        git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git -c core.hooksPath=/dev/null checkout --quiet --detach FETCH_HEAD
        python3 --version
        git --version
    - name: Validate repository and checkout identity
      run: python3 -B tools/ci_repository_binding.py
    - name: Prepare distribution Bubblewrap profile on the ephemeral CI host
      run: |-
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends bubblewrap apparmor-profiles
        python3 -B - <<'PY'
        import hashlib
        import json
        from pathlib import Path
        import re
        import stat
        import subprocess
        def validate_profile_file(path):
            metadata = path.lstat()
            if not stat.S_ISREG(metadata.st_mode) or metadata.st_uid != 0 or metadata.st_mode & 0o022 or metadata.st_size > 32768:
                raise ValueError('distribution profile must be a bounded root-owned regular file')
            data = path.read_bytes()
            if hashlib.sha256(data).hexdigest() != '11d39094f044f0cda0febb3ad517b830301da6b2ce929664af09ee9e4dd264f9':
                raise ValueError('distribution profile differs from the reviewed Ubuntu Noble policy')
            text = '\n'.join(line.split('#', 1)[0] for line in data.decode('utf-8').splitlines())
            header = re.search(r'profile\s+bwrap\s+/usr/bin/bwrap\s+flags=\(([^)]*)\)\s*\{', text)
            if header is None or set(flag.strip() for flag in header[1].split(',')) != {'attach_disconnected'}:
                raise ValueError('unexpected executable attachment or profile flags')
            if text.count('profile ') != 2 or 'profile unpriv_bwrap' not in text:
                raise ValueError('expected exactly the distribution bootstrap and child profiles')
            parent, child = text.split('profile unpriv_bwrap', 1)
            normal_parent = ' '.join(parent.split())
            normal_child = ' '.join(child.split())
            if 'allow px /** -> bwrap//&unpriv_bwrap,' not in normal_parent:
                raise ValueError('bootstrap must stack the capability-denying child profile')
            if 'audit deny capability,' not in normal_child or 'allow capability' in normal_child or 'allow pix /** -> &unpriv_bwrap,' not in normal_child:
                raise ValueError('child capability denial and recursive stacking are required')
            return {'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)}
        profile = Path('/usr/share/apparmor/extra-profiles/bwrap-userns-restrict')
        details = validate_profile_file(profile)
        owner = subprocess.run(['/usr/bin/dpkg-query', '-S', str(profile)], capture_output=True, text=True, check=True, timeout=5)
        if owner.stdout.strip() != 'apparmor-profiles: ' + str(profile):
            raise SystemExit('profile must belong to the installed distribution package')
        verified = subprocess.run(['/usr/bin/dpkg', '--verify', 'apparmor-profiles'], capture_output=True, text=True, timeout=5)
        if verified.returncode != 0 or verified.stdout.strip():
            raise SystemExit('distribution package verification failed')
        for name in ['/etc/apparmor.d/local/bwrap-userns-restrict', '/etc/apparmor.d/local/unpriv_bwrap']:
            path = Path(name)
            if path.exists() and any(line.split('#', 1)[0].strip() for line in path.read_text().splitlines()):
                raise SystemExit('local profile overrides require a separate review')
        print(json.dumps({'distribution_bwrap_profile_review': details, 'child_capabilities_required': 'DENIED'}, sort_keys=True))
        PY
        sudo /usr/sbin/apparmor_parser --skip-cache --skip-kernel-load /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
        # Add, do not replace an existing loaded policy or disable a restriction.
        sudo /usr/sbin/apparmor_parser --skip-cache --add /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
    - name: Observe host policy without changing confinement
      run: |-
        python3 -B - <<'PY'
        import hashlib
        import json
        from pathlib import Path
        import subprocess
        def token(name, allowed):
            try:
                value = Path(name).read_text().strip()
                return value if value in allowed else 'UNKNOWN'
            except OSError:
                return 'UNAVAILABLE'
        profiles = {}
        for name in ['/etc/apparmor.d/bwrap-userns-restrict', '/usr/share/apparmor/extra-profiles/bwrap-userns-restrict']:
            path = Path(name)
            row = {'present': path.is_file(), 'symlink': path.is_symlink()}
            if row['present'] and not row['symlink']:
                with path.open('rb') as file:
                    data = file.read(32769)
                if len(data) <= 32768:
                    row.update(sha256=hashlib.sha256(data).hexdigest(),
                               child_capability_denial=b'audit deny capability,' in data,
                               child_profile=b'profile unpriv_bwrap' in data)
            profiles[name] = row
        package = subprocess.run(['/usr/bin/dpkg-query', '-W', '-f=${binary:Package} ${Version}\n', 'bubblewrap', 'apparmor', 'apparmor-profiles'],
                                 capture_output=True, text=True, timeout=5)
        versions = {}
        for line in package.stdout.splitlines():
            fields = line.split()
            if len(fields) == 2 and fields[0] in {'bubblewrap', 'apparmor', 'apparmor-profiles'} and len(fields[1]) < 80:
                versions[fields[0]] = fields[1]
        print(json.dumps({'host_policy_observation': {
            'apparmor_enabled': token('/sys/module/apparmor/parameters/enabled', {'Y', 'N'}),
            'unprivileged_userns_restriction': token('/proc/sys/kernel/apparmor_restrict_unprivileged_userns', {'0', '1'}),
            'controller_profile': token('/proc/self/attr/current', {'unconfined'}),
            'distribution_profiles': profiles, 'package_versions': versions,
            'policy_changed': False, 'raw_profiles_emitted': False}}, sort_keys=True))
        PY
    - name: Qualify the actual isolation boundary
      run: python3 -B tools/run_ci_checks.py --mode isolation --out evidence/isolation
    - name: Run the entire discovered suite
      run: python3 -B tools/run_ci_checks.py --mode full --out evidence/full
    - name: Run bounded generative fixtures
      run: python3 -B tools/run_generative_cases_v8.py --out evidence/generative
    - name: Emit whitelisted JSON evidence to the job log
      if: always()
      run: |-
        python3 -B - <<'PY'
        import json
        from pathlib import Path
        for name in ['evidence/isolation/results.json', 'evidence/full/results.json', 'evidence/generative/summary.json']:
            path = Path(name)
            if path.is_file():
                print(json.dumps({"evidence_file": name, "summary": json.loads(path.read_text())}, sort_keys=True))
        # Emit fixed diagnostic codes only; private raw tracebacks stay local.
        isolation_log = Path('evidence/isolation/tests.log')
        if isolation_log.is_file():
            text = isolation_log.read_text()
            known = {
                'BWRAP_UID_MAP_DENIED': 'setting up uid map: Permission denied',
                'BWRAP_NETWORK_SETUP_DENIED': 'loopback: Failed RTM_NEWADDR: Operation not permitted',
                'BWRAP_NAMESPACE_CREATION_DENIED': 'Creating new namespace failed:',
                'BWRAP_UNSUPPORTED_ARGUMENT': 'Unknown option',
                'CHILD_STARTUP_PERMISSION_DENIED': 'Permission denied',
                'IPC_TIMEOUT': 'TimeoutError',
            }
            codes = sorted(code for code, marker in known.items() if marker in text)
            print(json.dumps({'isolation_diagnostic_codes': codes, 'raw_tracebacks_emitted': False}, sort_keys=True))
        # Observe fixed kernel denial fields; do not print the kernel log.
        import subprocess
        denied = None
        try:
            probe = subprocess.run(['/usr/bin/sudo', '-n', '/usr/bin/dmesg'],
                                   capture_output=True, text=True, timeout=5)
            if probe.returncode == 0:
                denied = any('apparmor="DENIED"' in line and 'comm="bwrap"' in line
                             and 'capname="net_admin"' in line for line in probe.stdout.splitlines())
        except (OSError, subprocess.TimeoutExpired):
            pass
        print(json.dumps({'apparmor_bwrap_net_admin_denial_observed': denied,
                          'raw_kernel_log_emitted': False}, sort_keys=True))
        PY
